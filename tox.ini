# tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist = py{310,311,312,313,314,315}

[gh-actions]
python =
  3.10: py310
  3.11: py311
  3.12: py312
  3.13: py313
  3.14: py314
  3.15: py315

[testenv]
deps = -rrequirements.txt
commands =
    pytest --override-ini junit_family=xunit1 --junit-xml=./results/UnitTest/junit.xml \
          --cov ./velocitas_sdk \
          --cov-report=xml:results/CodeCoverage/cobertura-coverage.xml \
          --cov-branch ./tests
[testenv:type]
basepython = python3
usedevelop = False
deps = -rrequirements.txt
commands =
    mypy --config-file setup.cfg velocitas_sdk
commands_pre =
    pip3 install -e {toxinidir}/

[coverage:run]
omit =
    velocitas_sdk/proto/*
